# CI: проверки, тесты, E2E, Lighthouse и Docker-образы. На main образы публикуются в ghcr.io,
# а если заданы переменные DEPLOY_* — сервер подтягивает их и перезапускает стек.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  # prisma generate в базу не ходит, но prisma.config.ts требует адрес
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  checks:
    name: Lint, typecheck, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Юнит-тесты всех пакетов и интеграционные тесты API: PostgreSQL и Redis поднимает
      # Testcontainers в Docker раннера
      - run: pnpm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium для Playwright
        run: pnpm --filter @apex/web exec playwright install --with-deps chromium
      # Боевая конфигурация: deploy/server.mjs с basePath /app/components, как на lenivec.online
      - run: pnpm --filter @apex/web test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APEX_PORT: 25590
      APEX_DIST_DIR: .next-e2e
      APEX_SECRETS: 'off'
      APEX_SITE_URL: http://127.0.0.1:25590/app/components
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Сборка, как на lenivec.online
        run: node deploy/build.mjs
      - name: Сервер
        run: |
          APEX_DATA_DIR="$RUNNER_TEMP/apex-data" nohup node deploy/server.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null "$APEX_SITE_URL/icon.svg" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Lighthouse (мобильный профиль, медиана трёх прогонов)
        run: npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.cjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14

  docker:
    name: Docker-образы
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API (он же воркер и миграции)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/apex-api:latest
            ${{ env.REGISTRY }}/apex-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Сайт
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          # Публичные адрес и ключ Turnstile вшиваются при сборке: Settings → Variables
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          tags: |
            ${{ env.REGISTRY }}/apex-web:latest
            ${{ env.REGISTRY }}/apex-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Деплой на сервер
    needs: [docker, lighthouse]
    # Только main и только если сервер описан: Settings → Variables (DEPLOY_HOST, DEPLOY_USER,
    # DEPLOY_PATH) и Secrets (DEPLOY_SSH_KEY). Без них шаг пропускается, CI остаётся зелёным.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            git pull --ff-only
            export WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/apex-web:${{ github.sha }}
            export API_IMAGE=ghcr.io/${{ github.repository_owner }}/apex-api:${{ github.sha }}
            docker compose -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans

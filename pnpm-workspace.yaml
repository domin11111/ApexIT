packages:
  - apps/*
  - packages/*

# pnpm 10 по умолчанию блокирует install-скрипты зависимостей — разрешаем только нужные.
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - esbuild

# Скрипты не нужны: нативные ускорители Testcontainers (ssh2/cpu-features) опциональны,
# у @swc/core, @parcel/watcher и unrs-resolver есть готовые бинарники в optionalDependencies,
# worker MSW для браузера кладётся в apps/web/public командой `msw init`.
ignoredBuiltDependencies:
  # Необязательное ускорение msgpack для BullMQ: без сборки работает JS-версия
  - msgpackr-extract
  - cpu-features
  - ssh2
  - protobufjs
  - msw
  - "@swc/core"
  - "@parcel/watcher"
  - unrs-resolver
